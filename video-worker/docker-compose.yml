version: "3.9"

# Dùng cho local development
# Chạy: docker-compose up

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-worker-fastapi-img
    container_name: video_fastapi
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - ./tmp:/app/tmp

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-worker-celery-img
    container_name: video_celery
    env_file: .env
    volumes:
      - .:/app
      - ./tmp:/app/tmp
    # Override CMD để chỉ chạy Celery (không chạy FastAPI)
    command: sh -c "celery -A worker.celery_app worker --pool=solo --loglevel=info"
    depends_on:
      - fastapi
