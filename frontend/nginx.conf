# Cổng nội bộ của stack: phục vụ giao diện và chuyển /api, /socket.io sang backend.
# Nginx của VPS (host) chỉ cần proxy_pass một địa chỉ duy nhất tới container này.

# Resolver của Docker + biến trong proxy_pass: nginx phân giải lại tên `backend` khi cần,
# nên không hỏng nếu backend khởi động sau hoặc đổi IP sau khi restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# Giữ nguyên giao thức gốc (https) nếu đã có proxy phía trước gửi tới
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Cho phép nâng cấp lên WebSocket khi client yêu cầu
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ---- API và realtime -> backend
  location /api/ {
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    client_max_body_size 100m;
  }

  location /socket.io/ {
    set $backend http://backend:3000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 3600s;
  }

  # ---- Giao diện (SPA)
  # File build có hash trong tên: cache lâu dài
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html không được cache để lần deploy sau có hiệu lực ngay
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Mọi đường dẫn khác trả về index.html (thay cho rewrite trong vercel.json)
  location / {
    try_files $uri /index.html;
  }
}
